services:
  api-dev:
    image: life365-public-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    env_file:
      - .env
    environment:
      TOKEN_SESSION_DATABASE_PATH: /data/token-sessions.sqlite3
    init: true
    profiles:
      - dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/data
    command:
      - fastapi
      - dev
      - app/main.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  life365-public-api:
    image: life365-public-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    env_file:
      - .env
    environment:
      TOKEN_SESSION_DATABASE_PATH: /data/token-sessions.sqlite3
    init: true
    profiles:
      - prod
    expose:
      - "8000"
    volumes:
      - ./data:/data
    networks:
      - life365-shared
    restart: unless-stopped

  scheduler:
    image: life365-public-api:latest
    env_file:
      - .env
    profiles:
      - dev
      - prod
    environment:
      TZ: UTC
    init: true
    volumes:
      - ./data:/data
    command:
      - /usr/local/bin/supercronic
      - /app/crons/jobs.cron
    restart: unless-stopped

networks:
  life365-shared:
    external: true
    name: life365-shared
