services:
  api-dev:
    image: life365-public-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    env_file:
      - .env
    environment:
      TOKEN_SESSION_DATABASE_PATH: /data/token-sessions.sqlite3
    init: true
    profiles:
      - dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/data
    command:
      - fastapi
      - dev
      - app/main.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  life365-public-api:
    image: life365-public-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    env_file:
      - .env
    environment:
      TOKEN_SESSION_DATABASE_PATH: /data/token-sessions.sqlite3
    init: true
    profiles:
      - prod
    expose:
      - "8000"
    volumes:
      - ./data:/data
    networks:
      - life365-shared
    restart: unless-stopped

  scheduler:
    image: life365-public-api:latest
    env_file:
      - .env
    profiles:
      - dev
      - prod
    environment:
      INACTIVE_CUSTOMERS_OUTPUT_PATH: /data/inactive-customers.json
      TZ: UTC
    init: true
    volumes:
      - ./data:/data
    command:
      - /usr/local/bin/supercronic
      - /app/crons/jobs.cron
    restart: unless-stopped

  customer-sync-test-db:
    image: postgres:18.6
    profiles:
      - test
    environment:
      POSTGRES_DB: life365_public_api_test_customer_sync
      POSTGRES_USER: customer_sync_test
      POSTGRES_PASSWORD: customer_sync_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U customer_sync_test -d life365_public_api_test_customer_sync
      interval: 2s
      timeout: 2s
      retries: 15

networks:
  life365-shared:
    external: true
    name: life365-shared
