x-api: &api
  build:
    context: .
    dockerfile: Dockerfile
    args:
      USER_ID: "${USER_ID:-1000}"
      GROUP_ID: "${GROUP_ID:-1000}"
  image: life365-public-api:latest
  env_file:
    - .env
  init: true

services:
  api-dev:
    <<: *api
    profiles:
      - dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command:
      - fastapi
      - dev
      - app/main.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  life365-public-api:
    <<: *api
    profiles:
      - prod
    expose:
      - "8000"
    networks:
      - life365-shared
    restart: unless-stopped

networks:
  life365-shared:
    external: true
    name: life365-shared
