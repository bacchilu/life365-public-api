services:
  api-dev:
    image: life365-public-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    env_file:
      - .env
    environment:
      TOKEN_SESSION_DATABASE_PATH: /data/token-sessions.sqlite3
      SANDBOX_DATABASE_HOST: local-postgres
      SANDBOX_DATABASE_PORT: "5432"
      SANDBOX_DB_PASSWORD: "${SANDBOX_DB_PASSWORD:-sandbox_local_only}"
      SANDBOX_JWT_SECRET_KEY: "${SANDBOX_JWT_SECRET_KEY:-}"
      SANDBOX_CUSTOMER_SYNC_FINGERPRINT_SECRET: "${SANDBOX_CUSTOMER_SYNC_FINGERPRINT_SECRET:-}"
    init: true
    profiles:
      - dev
    depends_on:
      local-postgres:
        condition: service_healthy
    networks:
      - default
      - local-database
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/data
    command:
      - fastapi
      - dev
      - app/main.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  life365-public-api:
    image: life365-public-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    env_file:
      - .env
    environment:
      TOKEN_SESSION_DATABASE_PATH: /data/token-sessions.sqlite3
      SANDBOX_DATABASE_HOST: local-postgres
      SANDBOX_DATABASE_PORT: "5432"
      SANDBOX_DB_PASSWORD: "${SANDBOX_DB_PASSWORD:-sandbox_local_only}"
      SANDBOX_JWT_SECRET_KEY: "${SANDBOX_JWT_SECRET_KEY:-}"
      SANDBOX_CUSTOMER_SYNC_FINGERPRINT_SECRET: "${SANDBOX_CUSTOMER_SYNC_FINGERPRINT_SECRET:-}"
    init: true
    profiles:
      - prod
    depends_on:
      local-postgres:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - ./data:/data
    networks:
      - life365-shared
      - local-database
    restart: unless-stopped

  scheduler:
    image: life365-public-api:latest
    env_file:
      - .env
    profiles:
      - dev
      - prod
    environment:
      INACTIVE_CUSTOMERS_OUTPUT_PATH: /data/inactive-customers.json
      TZ: UTC
    init: true
    volumes:
      - ./data:/data
    command:
      - /usr/local/bin/supercronic
      - /app/crons/jobs.cron
    restart: unless-stopped

  local-postgres:
    image: postgres:18.6
    profiles:
      - dev
      - prod
      - test
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: life365_local_admin
      POSTGRES_PASSWORD: "${LOCAL_POSTGRES_ADMIN_PASSWORD:-local_admin_only}"
      SANDBOX_DB_PASSWORD: "${SANDBOX_DB_PASSWORD:-sandbox_local_only}"
      CUSTOMER_SYNC_TEST_PASSWORD: "${CUSTOMER_SYNC_TEST_PASSWORD:-customer_sync_test}"
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - "/var/lib/postgresql:size=${LOCAL_POSTGRES_TMPFS_SIZE:-512m},mode=0755"
    volumes:
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - ./docker/postgres/sandbox:/opt/life365-sandbox:ro
      - ./migrations:/opt/life365-migrations:ro
    networks:
      - local-database
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$POSTGRES_PASSWORD" psql -X -h 127.0.0.1
          -U "$$POSTGRES_USER" -d postgres -Atqc
          "SELECT count(*) = 2 FROM pg_database WHERE datname IN
          ('life365_sandbox', 'life365_public_api_test_customer_sync')"
          | grep -qx t
      interval: 2s
      timeout: 2s
      retries: 30

networks:
  local-database:
  life365-shared:
    external: true
    name: life365-shared
