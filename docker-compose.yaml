x-api: &api
  image: life365-public-api:latest
  env_file:
    - .env
  environment:
    TOKEN_SESSION_DATABASE_PATH: /data/token-sessions.sqlite3
  init: true

services:
  api-dev:
    <<: *api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    profiles:
      - dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/data
    command:
      - fastapi
      - dev
      - app/main.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  life365-public-api:
    <<: *api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    profiles:
      - prod
    expose:
      - "8000"
    volumes:
      - ./data:/data
    networks:
      - life365-shared
    restart: unless-stopped

  scheduler:
    <<: *api
    profiles:
      - dev
      - prod
    environment:
      TZ: UTC
    volumes:
      - ./data:/data
    command:
      - /usr/local/bin/supercronic
      - /app/crons/jobs.cron
    restart: unless-stopped

networks:
  life365-shared:
    external: true
    name: life365-shared
